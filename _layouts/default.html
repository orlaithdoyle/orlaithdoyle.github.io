<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.name }}</title>
<meta name="description" content="{{ site.name }} ({{ site.irish_name }}). Space science graduate working with radar satellite data. Recently an ESA ESTEC intern on the BIOMASS mission.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%233cc6f2%27/%3E%3Cellipse cx=%2716%27 cy=%2716%27 rx=%2714%27 ry=%276%27 fill=%27none%27 stroke=%27%2393a0b5%27 stroke-width=%271.5%27 transform=%27rotate(-25 16 16)%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<div class="page">
<header>
  <p class="name"><svg class="orbit" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#3cc6f2"/><ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="#93a0b5" stroke-width="1.2" transform="rotate(-25 16 16)"/><circle cx="28.3" cy="10.2" r="1.6" fill="#e8ecf2"/></svg><a href="{{ '/' | relative_url }}">{{ site.name }}</a> <small>{{ site.irish_name }}</small></p>
  <nav>{% for item in site.menu %}<a href="{{ item.link | relative_url }}"{% if page.url == item.link %} aria-current="page"{% endif %}>{{ item.label }}</a> {% endfor %}</nav>
</header>
<main>
{% if page.photo %}<img class="portrait" src="{{ page.photo | relative_url }}" alt="Photo of {{ site.name }}">{% endif %}
{{ content }}
</main>
<hr>
<footer>
  <a href="mailto:{{ site.email }}">{{ site.email }}</a> &nbsp;|&nbsp;
  <a href="{{ site.linkedin }}">LinkedIn</a> &nbsp;|&nbsp;
  <a href="{{ site.github }}">GitHub</a> &nbsp;|&nbsp;
  <a href="{{ site.cv | relative_url }}">CV</a>
</footer>
</div>
</body>
</html>
