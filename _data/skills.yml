groups:
  - title: Earth observation and remote sensing
    skills:
      - name: SAR processing
        what: Six months working with Biomass P-band Level 1 products. Reading GeoTIFF and annotation files, calibration checks, multilooking, speckle reduction and land masking across different acquisition geometries.
        used:
          - {label: Salinity from Biomass, link: /projects.html#sea-surface-salinity-from-biomass}
          - {label: Amazon plume, link: /projects.html#hh-vv-phase-over-the-amazon-plume}
      - name: SAR polarimetry
        what: HH and VV co-polar phase difference, Pauli RGB composites and Cloude-Pottier H/α decomposition, used to separate surface scattering from other effects.
        used:
          - {label: Pacific ocean front, link: /projects.html#an-ocean-front-in-the-pacific}
          - {label: Salinity from Biomass, link: /projects.html#sea-surface-salinity-from-biomass}
      - name: Geophysical retrieval and validation
        what: Inverting a Fresnel and Debye dielectric model for salinity, correcting for wind roughness, and checking results against satellite and model data with bias and scatter statistics.
        used:
          - {label: Salinity from Biomass, link: /projects.html#sea-surface-salinity-from-biomass}
      - name: Ocean surface physics
        what: Wave spectra (Elfouhaily), two-scale Bragg scattering and how wind and swell roughen the sea surface, used to work out what was confusing the salinity signal.
        used:
          - {label: Pacific ocean front, link: /projects.html#an-ocean-front-in-the-pacific}
      - name: Ocean and atmosphere datasets
        what: SMOS, SMAP, GLORYS12, OSTIA, ERA5 and Sentinel-3 SST, accessed through Copernicus Marine and other portals, matched in time and space to radar scenes.
        used:
          - {label: Salinity from Biomass, link: /projects.html#sea-surface-salinity-from-biomass}
          - {label: Pacific ocean front, link: /projects.html#an-ocean-front-in-the-pacific}
      - name: Optical imagery and altimetry
        what: Sentinel-2 for signs of algae and SWOT for lake water levels, compared with local rainfall and gauge records.
        used:
